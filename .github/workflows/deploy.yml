# .github/workflows/deploy.yml
name: Deploy to GitHub Pages

on:
  # Run the workflow on push to the main branch
  push:
    branches: ['main']
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Build the project
      - name: Build project
        env:
          VITE_AYUSH_AI_ENDPOINT: ${{ vars.VITE_AYUSH_AI_ENDPOINT }}
        run: npm run build

      - name: Prepare portfolio routes for GitHub Pages
        run: |
          for route in about resume AyushAI projects case-studies; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done
          for slug in wischeduler wildfire-ml tally-ai gradey trip-rescue cloud-ai frontend-systems; do
            for route in projects case-studies; do
              mkdir -p "dist/$route/$slug"
              cp dist/index.html "dist/$route/$slug/index.html"
            done
          done
          cp dist/index.html dist/404.html

      # Step 5: Configure Pages deployment
      - name: Configure Pages
        uses: actions/configure-pages@v4

      # Step 6: Upload the build output
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'  # Path to the build output folder

      # Step 7: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
